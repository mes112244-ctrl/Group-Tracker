<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دفتر الدرجات — الفترتان</title><style>body{font-family:Tahoma,Arial;background:#f3f5f1;color:#253c31;margin:0;padding:20px}main{max-width:1250px;margin:auto}h1{margin-bottom:6px}.muted{color:#64736b}button,input,select{font:inherit;padding:9px;border-radius:9px;border:1px solid #ccd5ce}button{background:#275942;color:white;cursor:pointer;border:0;margin:3px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tablewrap{overflow:auto;background:white;border-radius:14px;border:1px solid #d9e0d9}table{border-collapse:collapse;min-width:1350px;width:100%;text-align:center}th,td{padding:9px;border:1px solid #e1e6e1}th{background:#e6eee7}td input{width:58px;text-align:center}td input.name{width:190px;text-align:right}.total{background:#dbece1;font-weight:bold}.error{color:#a52222}small{display:block}.info{padding:12px;background:white;border-radius:10px;margin:10px 0}.period{margin:24px 0}a{color:#275942}@media print{.toolbar,.actions,.info button{display:none!important}body{padding:0;background:white}.tablewrap{overflow:visible}table{min-width:0;font-size:9px}td input{width:35px;border:0;padding:2px}td input.name{width:105px}th,td{padding:3px}}</style></head><body><main><h1>📘 دفتر متابعة درجات الطالبات</h1><p class="muted">الفترة الأولى 50 + الفترة الثانية 50 = المجموع النهائي 100</p><p class="info">المشاركة 10 | الواجبات والمشروع 10 | المهام الأدائية 10 | متوسط 4 اختبارات محوّل إلى 15 | العملي 5. تُدخل درجة كل اختبار من 20.</p><div class="toolbar"><label>الشعبة <select id="section"></select></label><button onclick="addSection()">إضافة شعبة</button><button onclick="addStudent()">إضافة طالبة</button><button onclick="pasteStudents()">لصق أسماء</button><button onclick="backup()">تنزيل نسخة احتياطية</button><button onclick="document.getElementById('restore').click()">استعادة نسخة</button><input id="restore" type="file" accept=".json" hidden onchange="restoreFile(event)"><button onclick="window.print()">طباعة</button><a href="index.html">العودة للمنصة الأصلية</a></div><div id="tables"></div></main><script>
const KEY='group_tracker_gradebook_50_v1';const fields=['participation','homework','tasks','test1','test2','test3','test4','practical'];const max=[10,10,10,20,20,20,20,5];let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}if(!db||!Array.isArray(db.sections))db={sections:[{name:'الشعبة الأولى',students:[]}]};let active=0;const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function score(v,m){if(v===''||v===null||v===undefined)return 0;let n=Number(v);return Number.isFinite(n)?Math.max(0,Math.min(m,n)):0}function period(s,p){let d=s.periods[p]||{};let test= [1,2,3,4].map(i=>score(d['test'+i],20));let entered=[1,2,3,4].filter(i=>d['test'+i]!==''&&d['test'+i]!=null).length;let tests=entered?test.reduce((a,b)=>a+b,0)/entered*15/20:0;return +(score(d.participation,10)+score(d.homework,10)+score(d.tasks,10)+tests+score(d.practical,5)).toFixed(2)}function render(){ $('section').innerHTML=db.sections.map((s,i)=>`<option value="${i}" ${i===active?'selected':''}>${esc(s.name)}</option>`).join('');$('section').onchange=e=>{active=+e.target.value;render()};let students=db.sections[active].students;let content='';for(let p=0;p<2;p++){content+=`<section class="period"><h2>الفترة ${p===0?'الأولى':'الثانية'} — من 50 درجة</h2><div class="tablewrap"><table><thead><tr><th>م</th><th>اسم الطالبة</th><th>المشاركة /10</th><th>الواجبات والمشروع /10</th><th>المهام /10</th>${[1,2,3,4].map(i=>`<th>اختبار ${i} /20</th>`).join('')}<th>معدل الاختبارات /15</th><th>العملي /5</th><th>مجموع الفترة /50</th><th>الإجمالي /100</th><th class="actions">حذف</th></tr></thead><tbody>${students.map((s,i)=>{let d=s.periods[p]||{};let entered=[1,2,3,4].filter(k=>d['test'+k]!==''&&d['test'+k]!=null);let avg=entered.length?entered.reduce((a,k)=>a+score(d['test'+k],20),0)/entered.length*15/20:0;return `<tr><td>${i+1}</td><td><input class="name" value="${esc(s.name)}" onchange="editName(${i},this.value)"></td>${fields.slice(0,3).map((k,j)=>inp(i,p,k,max[j],d[k])).join('')}${fields.slice(3,7).map(k=>inp(i,p,k,20,d[k])).join('')}<td>${avg.toFixed(2)}</td>${inp(i,p,'practical',5,d.practical)}<td class="total">${period(s,p)}</td><td class="total">${(period(s,0)+period(s,1)).toFixed(2)}</td><td class="actions"><button onclick="delStudent(${i})">حذف</button></td></tr>`}).join('')}</tbody></table></div></section>`} $('tables').innerHTML=content||'<p>لا توجد طالبات</p>'}function inp(i,p,k,m,v){return `<td><input type="number" min="0" max="${m}" step="0.5" value="${v??''}" onchange="setGrade(${i},${p},'${k}',this.value,${m})"></td>`}function setGrade(i,p,k,v,m){if(v!==''&&(!Number.isFinite(Number(v))||Number(v)<0||Number(v)>m)){alert('الدرجة يجب أن تكون بين صفر و '+m);render();return}db.sections[active].students[i].periods[p][k]=v===''?'':Number(v);save();render()}function editName(i,v){db.sections[active].students[i].name=v;save()}function addStudent(name){let n=typeof name==='string'?name:prompt('اسم الطالبة');if(!n||!n.trim())return;db.sections[active].students.push({name:n.trim(),periods:[{},{}]});save();render()}function pasteStudents(){let t=prompt('الصقي أسماء الطالبات، كل اسم في سطر');if(!t)return;for(let n of t.split(/\r?\n/)){if(n.trim())addStudent(n.trim())}}function addSection(){let n=prompt('اسم الشعبة الجديدة');if(!n||!n.trim())return;db.sections.push({name:n.trim(),students:[]});active=db.sections.length-1;save();render()}function delStudent(i){if(confirm('حذف الطالبة من دفتر الدرجات؟')){db.sections[active].students.splice(i,1);save();render()}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='gradebook-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}function restoreFile(e){let f=e.target.files[0];if(!f)return;f.text().then(t=>{let d=JSON.parse(t);if(!Array.isArray(d.sections))throw Error('صيغة غير صحيحة');if(confirm('استبدال بيانات دفتر الدرجات الحالية بالنسخة الاحتياطية؟')){db=d;active=0;save();render()}}).catch(()=>alert('تعذر قراءة النسخة الاحتياطية'))}render();
</script></body></html>
