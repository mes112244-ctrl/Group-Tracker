<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دفتر الدرجات — الفترتان</title><style>body{font-family:Tahoma,Arial;background:#f3f5f1;color:#253c31;margin:0;padding:20px}main{max-width:1250px;margin:auto}h1{margin-bottom:6px}.muted{color:#64736b}button,input,select{font:inherit;padding:9px;border-radius:9px;border:1px solid #ccd5ce}button{background:#275942;color:white;cursor:pointer;border:0;margin:3px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tablewrap{overflow:auto;background:white;border-radius:14px;border:1px solid #d9e0d9}table{border-collapse:collapse;min-width:1350px;width:100%;text-align:center}th,td{padding:9px;border:1px solid #e1e6e1}th{background:#e6eee7}td input{width:58px;text-align:center}td input.name{width:190px;text-align:right}.total{background:#dbece1;font-weight:bold}.error{color:#a52222}small{display:block}.info{padding:12px;background:white;border-radius:10px;margin:10px 0}.period{margin:24px 0}a{color:#275942}@media print{.toolbar,.actions,.info button{display:none!important}body{padding:0;background:white}.tablewrap{overflow:visible}table{min-width:0;font-size:9px}td input{width:35px;border:0;padding:2px}td input.name{width:105px}th,td{padding:3px}}</style></head><body><main><h1>📘 دفتر متابعة درجات الطالبات</h1><p class="muted">الفترة الأولى 50 + الفترة الثانية 50 = المجموع النهائي 100</p><p class="info">المشاركة 10 | الواجبات والمشروع 10 | المهام الأدائية 10 | متوسط 4 اختبارات محوّل إلى 15 | العملي 5. تُدخل درجة كل اختبار من 20.</p><div class="toolbar"><label>الشعبة <select id="section"></select></label><button onclick="addSection()">إضافة شعبة</button><button onclick="addStudent()">إضافة طالبة</button><button onclick="pasteStudents()">لصق أسماء</button><button onclick="backup()">تنزيل نسخة احتياطية</button><button onclick="document.getElementById('restore').click()">استعادة نسخة</button><input id="restore" type="file" accept="
