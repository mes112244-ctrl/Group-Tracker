<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8fb" />
  <title>متابعة المجموعات التعاونية</title>
  <link rel="stylesheet" href="style.css" />
  <script src="section-switcher.js"defer></script>
</head>
<body>
  <header class="topbar no-print">
    <div>
      <h1>متابعة المجموعات التعاونية</h1>
      <p id="schoolLine">المرحلة الثانوية • متابعة 4 فترات</p>
    </div>
    <div class="toolbar">
      <button id="backupBtn">تصدير نسخة احتياطية</button>
      <label class="button secondary">استيراد نسخة احتياطية<input id="restoreInput" type="file" accept="application/json" hidden></label>
      <button id="printBtn" class="secondary">طباعة</button>
    </div>
  </header>

  <main class="app-shell">
    <aside class="sidebar no-print">
      <button class="nav active" data-view="dashboard">🏠 الرئيسية</button>
      <button class="nav" data-view="students">👩‍🎓 الطالبات</button>
      <button class="nav" data-view="groups">👥 المجموعات</button>
      <button class="nav" data-view="worksheets">📝 أوراق العمل</button>
      <button class="nav" data-view="quick">⚡ المتابعة السريعة</button>
      <button class="nav" data-view="reports">📊 التقارير والتحليل</button>
      <button class="nav" data-view="settings">⚙️ الإعدادات</button>
    </aside>

    <section class="content">
      <div id="view-dashboard" class="view active"></div>
      <div id="view-students" class="view"></div>
      <div id="view-groups" class="view"></div>
      <div id="view-worksheets" class="view"></div>
      <div id="view-quick" class="view"></div>
      <div id="view-reports" class="view"></div>
      <div id="view-settings" class="view"></div>
    </section>
  </main>

  <div id="modal" class="modal hidden no-print" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button id="modalClose" class="icon-btn">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
